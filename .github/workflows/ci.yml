name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      live_handshake:
        description: Explicitly call the hosted production MCP server
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Parse check
        run: node --check index.js

      - name: CLI smoke test
        run: |
          test "$(node index.js --version)" = "$(node -p "require('./package.json').version")"
          node index.js --help | grep -q "vitamind-mcp"

      - name: Offline stdio contract
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        run: npm test

  # Live monitoring is explicit, never a consequence of opening/updating a PR.
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_handshake == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Opt-in production handshake
        run: npm run test:live
